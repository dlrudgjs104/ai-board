<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 작업 보드</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --text:#1d232b; --muted:#6b7480; --soft:#f0f2f5;
  --red:#d93a3a; --red-bg:#fdecec; --amber:#b7791f; --amber-bg:#fdf4e3; --green:#2f855a; --green-bg:#e8f5ee;
  --blue:#2b6cb0; --blue-bg:#e8f0fb; --gray-bg:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111418; --panel:#191d23; --line:#2a3039; --text:#e6e9ee; --muted:#9aa3ae; --soft:#20252c;
  --red:#ff6b6b; --red-bg:#3a1f22; --amber:#f0b44c; --amber-bg:#3a2f1a; --green:#5fd39a; --green-bg:#173327;
  --blue:#78a9ff; --blue-bg:#1b2a44; --gray-bg:#262b33; --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.dot.off{background:var(--red)}
.meta{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--gray-bg)}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.blue{background:var(--blue-bg);color:var(--blue)} .chip.green{background:var(--green-bg);color:var(--green)}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--soft)}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.attn{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.attn h2,.feed h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600}
.attn .row{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
.attn .row:first-of-type{border-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .path{color:var(--muted);font-size:12px;word-break:break-all}
.card a{color:var(--blue);text-decoration:none;font-size:12px;font-weight:500}
.sess{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;background:var(--soft)}
.sess .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap}
.p-working{background:var(--blue-bg);color:var(--blue)} .p-needs_you{background:var(--red-bg);color:var(--red)}
.p-replied{background:var(--green-bg);color:var(--green)} .p-idle,.p-ended{background:var(--gray-bg);color:var(--muted)}
.p-stale{background:var(--amber-bg);color:var(--amber)}
.p-working::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.req{font-weight:600;word-break:break-word}
.sub{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-word;white-space:pre-wrap}
.sec{margin-top:12px}
.sec summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;gap:6px;align-items:center}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸";color:var(--muted);font-size:11px}
.sec[open] summary::before{content:"▾"}
.sec ul{margin:6px 0 0;padding-left:18px}
.sec li{margin:3px 0;word-break:break-word}
.sec li .subs{color:var(--muted);font-size:12px}
.n{color:var(--muted);font-weight:500}
.add{display:flex;gap:6px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.ev{display:grid;grid-template-columns:46px 1fr;gap:6px;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.ev:first-of-type{border-top:0}
.ev .t{color:var(--muted)} .ev b{font-weight:600}
.empty{color:var(--muted);padding:30px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>AI 작업 보드</h1>
  <span class="meta"><span class="dot" id="dot"></span><span id="updated">불러오는 중…</span></span>
  <div class="chips" id="chips"></div>
  <button id="notifyBtn" title="입력 대기·완료 때 브라우저 알림">🔔 알림 켜기</button>
</header>
<main>
  <section>
    <div id="attn"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="feed"><h2>최근 활동</h2><div id="feed"></div></aside>
</main>
<div class="toast" id="toast"></div>
<script>
const LIVE = {working:"작업 중", needs_you:"나를 기다림", replied:"답변 완료", idle:"대기", stale:"응답 없음", ended:"종료"};
const EV = {SessionStart:"▶ 세션 시작", UserPromptSubmit:"💬 요청", Commit:"📦 커밋", PostToolUse:"✏️ 수정",
  Notification:"🔔 확인 필요", Stop:"✅ 답변 완료", SessionEnd:"■ 세션 종료", TaskAdded:"➕ 할 일 추가",
  SyncError:"⚠ GitHub 반영 실패", HookError:"⚠ 훅 오류"};
const SECS = [["🔴","판단 필요",true],["🟡","진행 중",true],["⚪","예정",false],["🟢","완료 · 검토 대기",false]];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const d = Math.max(0, Math.floor(Date.now()/1000 - t));
  return d < 60 ? `${d}초 전` : d < 3600 ? `${Math.floor(d/60)}분 전` : d < 86400 ? `${Math.floor(d/3600)}시간 전` : `${Math.floor(d/86400)}일 전`; };
const hm = t => new Date(t*1000).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} } };
let prev = {}, openState = store.get("aiboard.open", {}), typing = {};

function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 1600); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("복사함: " + text) }catch{ prompt("복사해서 터미널에 붙여 넣으세요", text) } }
function notify(title, body){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, {body, tag: title + body}) }catch{}
}
document.getElementById("notifyBtn").onclick = async () => {
  if (!("Notification" in window)) return toast("이 브라우저는 알림을 지원하지 않습니다");
  const p = await Notification.requestPermission(); refreshNotifyBtn(); if (p === "granted") toast("알림을 켰습니다");
};
function refreshNotifyBtn(){ const b = document.getElementById("notifyBtn");
  b.style.display = ("Notification" in window && Notification.permission === "granted") ? "none" : ""; }

function sessionHTML(p, s){
  let detail = "";
  if (s.live === "needs_you" && s.note) detail = `🔔 ${esc(s.note)}`;
  else if ((s.live === "replied" || s.live === "ended") && s.summary) detail = esc(s.summary);
  else if (s.live === "working" && s.last_tool) detail = `지금: ${esc(s.last_tool)}`;
  const extra = [s.files ? `파일 ${s.files}개 수정` : "", s.commits && s.commits.length ? `커밋 ${esc(s.commits[s.commits.length-1])}` : "",
                 s.branch ? `브랜치 ${esc(s.branch)}` : "", s.mode && s.mode !== "personal" ? esc(s.mode) : ""].filter(Boolean).join(" · ");
  return `<div class="sess"><div class="top"><span class="pill p-${s.live}">${LIVE[s.live] || s.live}</span>
    <span class="meta">${ago(s.last_activity)}</span>
    ${s.live !== "ended" ? `<button data-copy="cd ${esc(p.path)} && claude-${esc(s.mode || "personal")} --resume ${esc(s.id)}" title="이 세션을 이어서 여는 명령 복사">이어서 열기</button>` : ""}</div>
    <div class="req">${esc(s.request || "(아직 요청 없음)")}</div>
    ${detail ? `<div class="sub">${detail}</div>` : ""}${extra ? `<div class="sub">${extra}</div>` : ""}</div>`;
}

function render(st){
  const grid = document.getElementById("grid"), attn = document.getElementById("attn");
  let waiting = [], working = 0, reds = 0, live = 0;
  for (const p of st.projects){
    for (const s of p.sessions){
      if (["working","needs_you","replied","idle"].includes(s.live)) live++;
      if (s.live === "working") working++;
      if (s.live === "needs_you") waiting.push({p, s, why: s.note || "입력이 필요합니다"});
      const key = s.id, was = prev[key];
      if (was && was !== s.live){
        if (s.live === "needs_you") notify(`🔔 ${p.name}: 확인이 필요합니다`, s.note || s.request || "");
        if (s.live === "replied" && was === "working") notify(`✅ ${p.name}: 답변 완료`, (s.summary || "").slice(0,180));
      }
      prev[key] = s.live;
    }
    reds += ((p.status||{}).sections||{})["🔴"]?.length || 0;
  }
  const done = st.projects.flatMap(p => p.sessions.filter(s => s.live === "replied" && Date.now()/1000 - s.last_activity < 1800).map(s => ({p, s})));
  document.getElementById("chips").innerHTML =
    `<span class="chip red">🔔 나를 기다림 ${waiting.length}</span><span class="chip blue">⚙ 작업 중 ${working}</span>
     <span class="chip green">✅ 최근 완료 ${done.length}</span><span class="chip amber">🔴 판단 필요 ${reds}</span>
     <span class="chip">세션 ${live} · 프로젝트 ${st.projects.length}</span>`;
  document.title = (waiting.length ? `(${waiting.length}) ` : "") + "AI 작업 보드";

  const rows = [...waiting.map(w => `<div class="row"><span class="pill p-needs_you">기다림</span><b>${esc(w.p.name)}</b><span>${esc(w.why)}</span></div>`),
                ...done.map(d => `<div class="row"><span class="pill p-replied">완료</span><b>${esc(d.p.name)}</b><span>${esc((d.s.summary||"").slice(0,160))}</span></div>`)];
  attn.innerHTML = rows.length ? `<div class="attn"><h2>지금 볼 것</h2>${rows.join("")}</div>` : "";

  if (!st.projects.length){
    grid.innerHTML = `<div class="empty">아직 기록된 프로젝트가 없습니다.<br>프로젝트 폴더에서 <code>ai-init .</code> 후 <code>claude-personal</code> 로 시작하면 여기에 나타납니다.</div>`;
    return;
  }
  // 입력 중인 칸은 다시 그리지 않도록 값 보존
  document.querySelectorAll(".add input").forEach(i => typing[i.dataset.path] = i.value);
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.path : null;
  grid.innerHTML = st.projects.map(p => {
    const sec = (p.status||{}).sections || {};
    const secs = p.status ? SECS.map(([e, label, def]) => {
      const items = sec[e] || [], k = p.path + e, open = openState[k] ?? (def && items.length > 0);
      return `<details class="sec" data-k="${esc(k)}" ${open ? "open" : ""}><summary>${e} ${label} <span class="n">${items.length}</span></summary>
        ${items.length ? `<ul>${items.map(i => `<li>${esc(i.text)}${i.sub.length ? `<div class="subs">${i.sub.map(esc).join("<br>")}</div>` : ""}</li>`).join("")}</ul>` : `<div class="sub">없음</div>`}</details>`;
    }).join("") : `<div class="sub">docs/STATUS.md 없음 — <code>ai-init ${esc(p.path)}</code></div>`;
    return `<div class="card"><h3>${esc(p.name)} ${p.issue ? `<a href="${esc(p.issue)}" target="_blank" rel="noopener">GitHub 현황 ↗</a>` : ""}</h3>
      <div class="path">${esc(p.path)}${p.status && p.status.updated ? ` · STATUS ${esc(p.status.updated)}` : ""}</div>
      ${p.sessions.map(s => sessionHTML(p, s)).join("") || `<div class="sub" style="margin-top:8px">실행 중인 세션 없음</div>`}
      ${secs}
      ${p.status ? `<form class="add" data-path="${esc(p.path)}"><input data-path="${esc(p.path)}" placeholder="할 일 추가 (⚪ 예정에 들어감)" maxlength="300"><button>추가</button></form>` : ""}
      <div class="actions"><button data-copy="cd ${esc(p.path)} && claude-personal" title="이 프로젝트에서 새 세션을 여는 명령 복사">새 세션 명령 복사</button>
      <button data-copy="cd ${esc(p.path)} && claude-work">회사 모드(claude-work)</button></div></div>`;
  }).join("");
  document.querySelectorAll(".add input").forEach(i => { if (typing[i.dataset.path]) i.value = typing[i.dataset.path]; if (i.dataset.path === focused) i.focus(); });

  document.getElementById("feed").innerHTML = st.events.filter(e => EV[e.event]).slice(0, 60).map(e =>
    `<div class="ev"><span class="t">${hm(e.t)}</span><span><b>${esc(e.project || "")}</b> ${EV[e.event]}${e.detail ? `<br><span class="meta">${esc(String(e.detail).slice(0,140))}</span>` : ""}</span></div>`
  ).join("") || `<div class="meta">아직 활동이 없습니다</div>`;
}

document.addEventListener("click", e => { const c = e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy); });
document.addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details[data-k]")) { openState[d.dataset.k] = d.open; store.set("aiboard.open", openState); } }, true);
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, input = f.querySelector("input"), text = input.value.trim(); if (!text) return;
  const r = await fetch("/api/task", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({path: f.dataset.path, text})});
  if (r.ok){ input.value = ""; typing[f.dataset.path] = ""; toast("할 일을 추가했습니다"); tick(); } else toast("추가하지 못했습니다");
});

let failed = 0;
async function tick(){
  try{
    const r = await fetch("/api/state", {cache:"no-store"}); const st = await r.json();
    render(st); failed = 0;
    document.getElementById("dot").className = "dot";
    document.getElementById("updated").textContent = `실시간 · ${hm(st.now)} 갱신`;
  }catch{
    if (++failed > 1){ document.getElementById("dot").className = "dot off";
      document.getElementById("updated").textContent = "서버 연결 끊김 — 터미널에서 ai-board 실행"; }
  }
}
refreshNotifyBtn(); tick(); setInterval(tick, 2000);
</script>
</body>
</html>
